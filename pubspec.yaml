name: eatplek_app
description: "EatPlek — Food delivery and restaurant booking platform."
publish_to: "none"

# ── IMPORTANT: Bump version before every Play Store upload ───────────────────
# versionCode (the integer after +) must be higher than the last upload.
# versionName is the user-visible string shown on the store.
version: 1.0.37+37

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # ── UI & Fonts ──────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  flutter_svg: ^2.2.0 # Used everywhere for SvgPicture.string()
  svg_flutter: ^0.0.1 # Used in order_success_view + orders_list (SvgPicture.string)
  percent_indicator: ^4.2.5 # Used in on_boarding_view
  pinput: ^5.0.1
  carousel_slider: ^5.1.1 # Used in banner_carousal_section
  skeletonizer: ^2.1.0+1

  # ── Animations ──────────────────────────────────────────────────────────────
  flutter_animate: ^4.5.0

  # ── Images ──────────────────────────────────────────────────────────────────
  cached_network_image: ^3.4.1
  cloudinary: ^1.2.0 # Used in api_client.dart for profile photo upload

  # ── Networking & Storage ────────────────────────────────────────────────────
  fittor: ^1.1.3+1
  shared_preferences: ^2.5.3

  # ── State Management & Navigation ───────────────────────────────────────────
  get: ^4.7.2

  # ── Internationalisation ────────────────────────────────────────────────────
  intl: ^0.20.2

  # ── Platform & Device ───────────────────────────────────────────────────────
  device_info_plus: ^11.1.1 # Used in auth_controller + profile_completion_controller
  url_launcher: ^6.3.2

  # ── Sharing ─────────────────────────────────────────────────────────────────
  share_plus: ^10.1.4

  # ── Location & Maps ─────────────────────────────────────────────────────────
  # google_maps_flutter REMOVED — no GoogleMap widget found in codebase.
  # App uses flutter_map + OpenStreetMap instead (no billing/API key required).
  geolocator: ^14.0.2
  geocoding: ^4.0.0 # Used in location_picker + home + profile_completion
  latlong2: ^0.9.1
  flutter_map: ^8.2.2

  # ── Firebase ─────────────────────────────────────────────────────────────────
  firebase_core: ^4.5.0

  # ── Payments ────────────────────────────────────────────────────────────────
  phonepe_payment_sdk: ^3.0.2

  # ── Notifications ────────────────────────────────────────────────────────────
  onesignal_flutter: ^5.5.1
  flutter_local_notifications: ^21.0.0

  # ── Navigation bottom bar ────────────────────────────────────────────────────
  # google_nav_bar REMOVED — project uses CustomPainter bottom nav, not google_nav_bar.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/image/
