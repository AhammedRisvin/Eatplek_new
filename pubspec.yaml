name: eatplek_app
description: "EatPlek — Food delivery and restaurant booking platform."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # ── UI & Fonts ──────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  flutter_svg: ^2.2.0
  percent_indicator: ^4.2.5
  pinput: ^5.0.1
  carousel_slider: ^5.1.1
  google_nav_bar: ^5.0.7
  skeletonizer: ^2.1.0+1

  # ── Animations ──────────────────────────────────────────────────────────────
  flutter_animate: ^4.5.0

  # ── Images ──────────────────────────────────────────────────────────────────
  cached_network_image: ^3.4.1
  cloudinary: ^1.2.0

  # ── Networking & Storage ────────────────────────────────────────────────────
  fittor: ^1.1.3+1
  shared_preferences: ^2.5.3

  # ── State Management & Navigation ───────────────────────────────────────────
  get: ^4.7.2

  # ── Internationalisation ────────────────────────────────────────────────────
  intl: ^0.20.2

  # ── Platform & Device ───────────────────────────────────────────────────────
  device_info_plus:
  url_launcher: ^6.3.2

  # ── Sharing ─────────────────────────────────────────────────────────────────
  share_plus: ^10.1.4

  # ── Location & Maps ─────────────────────────────────────────────────────────
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  latlong2: ^0.9.1
  flutter_map: ^8.2.2

  # ── Firebase & Notifications ─────────────────────────────────────────────────
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  awesome_notifications: ^0.11.0

  # ── Payments ────────────────────────────────────────────────────────────────
  phonepe_payment_sdk: ^3.0.2

  # ── SVG (legacy — svg_flutter kept for any existing svg_flutter imports) ────
  svg_flutter: ^0.0.1
  onesignal_flutter: ^5.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/image/
